[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-embedding-map"
version = "0.1.0"
description = "Controlled comparison of raw-pixel Eigenfaces and frozen deep face embeddings, plus a webcam lighting study"
requires-python = ">=3.12"
authors = [{ name = "Nic Groenewald" }]
# Exact runtime pins live in requirements.txt, which the paper cites verbatim;
# this file only declares the package surface and the test configuration.

[tool.setuptools]
packages = ["fem"]

[tool.pytest.ini_options]
# Why: the test suite must be fast, offline and headless.  `tests/conftest.py`
# sets MPLCONFIGDIR and the Agg backend; here we only pin discovery and keep
# numerical warnings loud (a RuntimeWarning in this project usually means a
# degenerate metric, e.g. correlation of a constant series).
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::RuntimeWarning"]
